name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Notify Discord
        if: always() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          # Inlined from smart-memory-infra/.github/actions/discord-notify (private repo
          # not accessible from this public repo's workflow runner).
          case "$STATUS" in
            success)   EMOJI="✅"; COLOR=3066993 ;;
            failure)   EMOJI="❌"; COLOR=15158332 ;;
            cancelled) EMOJI="⚠️"; COLOR=15844367 ;;
            *)         EMOJI="ℹ️"; COLOR=3447003 ;;
          esac
          PAYLOAD=$(jq -nc --arg t "$EMOJI $REPO · $WORKFLOW_NAME · $STATUS" \
                              --arg u "$RUN_URL" \
                              --argjson c "$COLOR" \
              '{embeds:[{title:$t, url:$u, color:$c}]}')
          curl -sS -X POST -H "Content-Type: application/json" \
               -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true
