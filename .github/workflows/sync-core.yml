name: Sync to core release

# The SDK joined the unified product line: core's VERSION is the single source of
# truth and this package COPIES it verbatim on every core release, then ships at
# that number. (The SDK does not pin or import core — it just tracks the shared
# product version so all five packages always carry the identical number.)
on:
  repository_dispatch:
    types: [core-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version to copy (e.g. 1.4.25)'
        required: true
        type: string

concurrency:
  group: sync-core
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PAT so the push to main triggers publish.yml
          # (pushes made by GITHUB_TOKEN do not trigger workflows).
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Copy product version into package.json
        id: bump
        env:
          PRODUCT_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Set package.json version to the product version (do NOT touch package-lock; house policy).
          node - <<'JS'
          const fs = require('fs');
          const v = (process.env.PRODUCT_VERSION || '').trim();
          if (!/^\d+\.\d+\.\d+$/.test(v)) { console.error(`::error::Bad version '${v}'`); process.exit(1); }
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = v;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\n`);
          if (fs.existsSync('CHANGELOG.md')) {
            let c = fs.readFileSync('CHANGELOG.md', 'utf8');
            const entry = `\n### Changed (auto, lockstep) — track product version ${v} (${v})\n` +
              `- Version copied from the smartmemory-core release (single-source lockstep).\n`;
            if (c.includes('## [Unreleased]')) {
              fs.writeFileSync('CHANGELOG.md', c.replace('## [Unreleased]', '## [Unreleased]' + entry));
            }
          }
          console.log(`@smartmemory/sdk-js -> ${v} (copied)`);
          JS

      - name: Commit + push (triggers publish)
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "smartmem-dev[bot]"
          git config user.email "smartmem-dev@users.noreply.github.com"
          if git diff --quiet; then
            echo "Already at $V; nothing to do."
            exit 0
          fi
          git add package.json CHANGELOG.md 2>/dev/null || git add package.json
          git commit -m "chore(version): track product version $V (single-source lockstep)"
          git push origin HEAD:main
          echo "✅ Pushed @smartmemory/sdk-js v$V (publish.yml will ship to npm)."
