name: Sync to service API change

# Chain B (consumer): the service's API contract changed (OpenAPI snapshot diff) ->
# repository_dispatch 'api-changed' lands here. Patch-bump package.json and push to
# main; the existing publish.yml (on push: main) builds and publishes to npm.
on:
  repository_dispatch:
    types: [api-changed]
  workflow_dispatch:

concurrency:
  group: sync-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PAT so the push to main triggers publish.yml
          # (pushes made by GITHUB_TOKEN do not trigger workflows).
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Patch-bump package.json
        id: bump
        env:
          SERVICE_SHA: ${{ github.event.client_payload.service_sha }}
        run: |
          set -euo pipefail
          # Bump package.json only (do NOT touch package-lock; house policy).
          node - <<'JS'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [maj, min, pat] = p.version.split('.').map(Number);
          const v = `${maj}.${min}.${pat + 1}`;
          p.version = v;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\n`);
          const sha = (process.env.SERVICE_SHA || '').slice(0, 7);
          if (fs.existsSync('CHANGELOG.md')) {
            let c = fs.readFileSync('CHANGELOG.md', 'utf8');
            const entry = `\n### Changed (auto) — service API contract changed (${v})\n` +
              `- Auto patch-bump triggered by smart-memory-service API change` +
              `${sha ? ` (${sha})` : ''}. Review SDK coverage of new/changed fields.\n`;
            if (c.includes('## [Unreleased]')) {
              c = c.replace('## [Unreleased]', '## [Unreleased]' + entry);
              fs.writeFileSync('CHANGELOG.md', c);
            }
          }
          console.log(`@smartmemory/sdk-js -> ${v}`);
          JS

      - name: Commit + push (triggers publish)
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "smartmem-dev[bot]"
          git config user.email "smartmem-dev@users.noreply.github.com"
          git add package.json CHANGELOG.md 2>/dev/null || git add package.json
          git commit -m "chore: bump to $V (service API contract changed)"
          git push origin HEAD:main
          echo "✅ Pushed @smartmemory/sdk-js v$V (publish.yml will ship to npm)."
